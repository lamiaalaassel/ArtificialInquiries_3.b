<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artificial Inquiries</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    header { background: #263b5e; color: white; text-align: center; padding: 25px 15px; }
    main { max-width: 1000px; margin: 30px auto; padding: 20px; }
    .panel { background: white; padding: 22px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 2px 8px #00000012; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 11px; margin-top: 7px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    button { padding: 10px 15px; margin-top: 15px; margin-right: 5px; border: none; border-radius: 5px; cursor: pointer; background: #263b5e; color: white; }
    button:hover { opacity: 0.85; }
    .delete { background: #c0392b; }
    .edit { background: #287a57; }
    .cancel { background: #666; }
    .item { border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-top: 12px; overflow-wrap: anywhere; }
    .item h3 { margin-top: 0; }
    .empty { color: #666; }
  </style>
</head>

<body>
  <header>
    <h1>Artificial Inquiries</h1>
    <p>Gestion des données du projet avec Omeka S (base commune)</p>
    <div id="authBar" style="margin-top:12px">
      <span id="authStatus">Vérification de la connexion...</span>
      <button type="button" id="loginLink" hidden>Se connecter</button>
      <button type="button" id="logoutButton" hidden>Se déconnecter</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">Ajouter un élément</h2>

      <form id="itemForm">
        <label for="resourceClass">Classe</label>
        <select id="resourceClass" required></select>

        <label for="title">Titre ou nom</label>
        <input type="text" id="title" placeholder="Ex. : Nutrition" required>

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Décris cet élément..."></textarea>

        <button type="submit" id="submitButton">Ajouter</button>
        <button type="button" id="cancelButton" class="cancel" hidden>Annuler</button>
      </form>
    </section>

    <section class="panel">
      <h2>Liste des éléments</h2>

      <label for="filterClass">Filtrer par classe</label>
      <select id="filterClass"></select>

      <div id="itemList"></div>
    </section>
  </main>

  <script>
    // URL du proxy PHP vers l'API Omeka S de la base commune
    const API_URL = "/omeka-proxy.php";

    // ------------------------------------------------------------------
    // CONFIGURATION : classes et modèles de la BASE COMMUNE
    // type       = terme du vocabulaire commun (préfixe artinq:)
    // classId    = ID de la classe dans la base commune   (À REMPLIR)
    // templateId = ID du resource template importé        (À REMPLIR)
    // ------------------------------------------------------------------
    const resourceConfig = {
      "Catégorie de tâche":         { type: "artinq:CategorieTache",        classId: null, templateId: null },
      "Conversation":               { type: "artinq:Conversation",          classId: null, templateId: null },
      "Conversation marquante":     { type: "artinq:ConversationMarquante",  classId: null, templateId: null },
      "Dé":                         { type: "artinq:De",                     classId: null, templateId: null },
      "Historique de conversations":{ type: "artinq:Historique",             classId: null, templateId: null },
      "Passation":                  { type: "artinq:Passation",              classId: null, templateId: null }
    };

    // Correspondance type Omeka -> libellé affiché
    const classMapping = Object.fromEntries(
      Object.entries(resourceConfig).map(([label, cfg]) => [cfg.type, label])
    );

    let items = [];
    let editingId = null;

    const form = document.getElementById("itemForm");
    const resourceClass = document.getElementById("resourceClass");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const itemList = document.getElementById("itemList");
    const filterClass = document.getElementById("filterClass");
    const formTitle = document.getElementById("formTitle");
    const submitButton = document.getElementById("submitButton");
    const cancelButton = document.getElementById("cancelButton");

    // Remplir les listes déroulantes à partir de la configuration
    function fillSelects() {
      const labels = Object.keys(resourceConfig);
      resourceClass.replaceChildren(...labels.map(l => new Option(l, l)));
      filterClass.replaceChildren(
        new Option("Toutes les classes", "Toutes"),
        ...labels.map(l => new Option(l, l))
      );
    }

    // READ : afficher les éléments
    function displayItems() {
      itemList.replaceChildren();
      const selectedClass = filterClass.value;

      const filteredItems = items.filter(item =>
        selectedClass === "Toutes" || item.resourceClass === selectedClass
      );

      if (filteredItems.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "Aucun élément à afficher.";
        itemList.appendChild(message);
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement("article");
        card.className = "item";

        const heading = document.createElement("h3");
        heading.textContent = item.title;

        const classText = document.createElement("p");
        classText.textContent = "Classe : " + item.resourceClass;

        const descriptionText = document.createElement("p");
        descriptionText.textContent = item.displayDescription || "Aucune description.";

        const editButton = document.createElement("button");
        editButton.className = "edit";
        editButton.textContent = "Modifier";
        editButton.addEventListener("click", () => editItem(item.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Supprimer";
        deleteButton.addEventListener("click", () => deleteItem(item.id));

        card.append(heading, classText, descriptionText, editButton, deleteButton);
        itemList.appendChild(card);
      });
    }

    // Affiche les propriétés artinq: d'un item (vocabulaire commun)
    function getResourceDetails(item) {
      return Object.entries(item)
        .filter(([key]) => key.startsWith("artinq:"))
        .map(([key, values]) => {
          if (!Array.isArray(values)) return null;
          const text = values
            .map(v => v["@value"] ?? v["o:label"] ?? v["display_title"] ?? "")
            .filter(Boolean)
            .join(", ");
          return text ? `${key.replace("artinq:", "")} : ${text}` : null;
        })
        .filter(Boolean)
        .join(" | ");
    }

    // READ : récupérer les ressources depuis la base commune
    async function loadItems() {
      try {
        const response = await fetch(`${API_URL}?pretty_print=1&per_page=100`);
        if (!response.ok) throw new Error("Erreur HTTP : " + response.status);

        const data = await response.json();

        items = data
          .map(item => {
            const type = item["@type"] || [];
            const typeName = type.find(t => classMapping[t]);
            const rawDescription = item["dcterms:description"]?.[0]?.["@value"] || "";

            return {
              id: item["o:id"],
              resourceClass: typeName ? classMapping[typeName] : null,
              title:
                item["dcterms:title"]?.[0]?.["@value"] ||
                item["o:title"] ||
                "Sans titre",
              rawDescription,
              displayDescription: rawDescription || getResourceDetails(item)
            };
          })
          // On ne garde que les classes gérées par cette IHM
          .filter(item => item.resourceClass !== null);

        displayItems();
        console.log("Ressources chargées depuis la base commune :", items.length);
      } catch (error) {
        console.error("Erreur de connexion à Omeka :", error);
        itemList.textContent = "Impossible de charger les ressources depuis Omeka S.";
      }
    }

    // CREATE et UPDATE
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const selectedClass = resourceClass.value;
      const itemTitle = title.value.trim();
      const itemDescription = description.value.trim();
      const config = resourceConfig[selectedClass];

      if (!itemTitle) { alert("Veuillez saisir un titre."); return; }
      if (!config) { alert("Classe de ressource inconnue."); return; }
      if (!config.classId || !config.templateId) {
        alert("IDs de classe/modèle non renseignés pour « " + selectedClass +
              " ». Complétez resourceConfig avec les IDs de la base commune.");
        return;
      }

      const itemData = {
        "o:resource_class": { "o:id": config.classId },
        "o:resource_template": { "o:id": config.templateId },
        "dcterms:title": [{ type: "literal", property_id: 1, "@value": itemTitle }],
        "dcterms:description": itemDescription
          ? [{ type: "literal", property_id: 4, "@value": itemDescription }]
          : []
      };

      try {
        const isEditing = editingId !== null;
        const response = await fetch(
          isEditing ? `${API_URL}?id=${editingId}` : API_URL,
          {
            method: isEditing ? "PATCH" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(itemData)
          }
        );

        const result = await response.json();
        if (!response.ok) {
          console.error("Erreur Omeka :", result);
          throw new Error(result["o:message"] || JSON.stringify(result));
        }

        alert(isEditing ? "Ressource modifiée avec succès !" : "Ressource ajoutée avec succès !");
        resetForm();
        await loadItems();
      } catch (error) {
        console.error("Erreur CRUD :", error);
        alert("Erreur : " + error.message);
      }
    });

    // Préparer la modification
    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      editingId = id;
      resourceClass.value = item.resourceClass;
      title.value = item.title;
      description.value = item.rawDescription; // vraie description, pas le résumé des propriétés

      formTitle.textContent = "Modifier un élément";
      submitButton.textContent = "Enregistrer";
      cancelButton.hidden = false;
      form.scrollIntoView({ behavior: "smooth" });
    }

    // DELETE
    async function deleteItem(id) {
      if (!confirm("Voulez-vous vraiment supprimer cet élément ?")) return;

      try {
        const response = await fetch(`${API_URL}?id=${id}`, { method: "DELETE" });
        if (!response.ok) {
          const error = await response.text();
          throw new Error(error || "Suppression impossible.");
        }
        if (editingId === id) resetForm();
        alert("Ressource supprimée avec succès !");
        await loadItems();
      } catch (error) {
        console.error("Erreur de suppression :", error);
        alert("Erreur : " + error.message);
      }
    }

    function resetForm() {
      form.reset();
      editingId = null;
      formTitle.textContent = "Ajouter un élément";
      submitButton.textContent = "Ajouter";
      cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", resetForm);
    filterClass.addEventListener("change", displayItems);

    // Authentification locale : le serveur vérifie aussi la session
    const authStatus = document.getElementById("authStatus");
    const loginLink = document.getElementById("loginLink");
    const logoutButton = document.getElementById("logoutButton");

    function setCrudEnabled(enabled) {
      form.querySelectorAll("input, select, textarea, button")
        .forEach(el => { el.disabled = !enabled; });
      filterClass.disabled = !enabled;
      itemList.querySelectorAll("button").forEach(b => { b.disabled = !enabled; });
    }

    async function checkAuthentication() {
      try {
        const response = await fetch("/auth/check.php", { method: "GET", credentials: "same-origin" });
        const result = await response.json();
        if (!response.ok || !result.authenticated) throw new Error("Connexion requise.");

        authStatus.textContent = "Connecté : " + result.user.name;
        loginLink.hidden = true;
        logoutButton.hidden = false;
        setCrudEnabled(true);
        await loadItems();
      } catch (error) {
        authStatus.textContent = "Veuillez vous connecter pour gérer les ressources.";
        loginLink.hidden = false;
        logoutButton.hidden = true;
        setCrudEnabled(false);
        itemList.textContent = "Connectez-vous pour afficher les ressources.";
      }
    }

    loginLink.addEventListener("click", () => { window.location.href = "/auth.html"; });

    logoutButton.addEventListener("click", async () => {
      try {
        const response = await fetch("/auth/logout.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Déconnexion impossible.");
        window.location.href = "/auth.html";
      } catch (error) {
        alert(error.message);
      }
    });

    fillSelects();
    setCrudEnabled(false);
    checkAuthentication();
  </script>
</body>
</html>
