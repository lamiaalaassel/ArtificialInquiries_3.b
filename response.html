
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artificial Inquiries</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #263b5e;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000012;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    button {
      padding: 10px 15px;
      margin-top: 15px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #263b5e;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .delete {
      background: #c0392b;
    }

    .edit {
      background: #287a57;
    }

    .cancel {
      background: #666;
    }

    .item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 15px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .item h3 {
      margin-top: 0;
    }

    .empty {
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>Artificial Inquiries</h1>
    <p>Gestion des données du projet avec Omeka S</p>
    <div id="authBar" style="margin-top:12px">
      <span id="authStatus">Vérification de la connexion...</span>
      <button type="button" id="loginLink" hidden>Se connecter</button>
      <button type="button" id="logoutButton" hidden>Se déconnecter</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">Ajouter un élément</h2>

      <form id="itemForm">
        <label for="resourceClass">Classe</label>
        <select id="resourceClass" required>
          <option value="Catégorie">Catégorie</option>
          <option value="Conversation">Conversation</option>
          <option value="Conversation mémorable">
            Conversation mémorable
          </option>
          <option value="Dé">Dé</option>
          <option value="Fiche">Fiche</option>
          <option value="Historique">Historique</option>
          <option value="Parcours">Parcours</option>
        </select>

        <label for="title">Titre ou nom</label>
        <input
          type="text"
          id="title"
          placeholder="Ex. : Nutrition"
          required
        >

        <label for="description">Description</label>
        <textarea
          id="description"
          rows="3"
          placeholder="Décris cet élément..."
        ></textarea>

        <button type="submit" id="submitButton">
          Ajouter
        </button>

        <button
          type="button"
          id="cancelButton"
          class="cancel"
          hidden
        >
          Annuler
        </button>
      </form>
    </section>

    <section class="panel">
      <h2>Liste des éléments</h2>

      <label for="filterClass">Filtrer par classe</label>
      <select id="filterClass">
        <option value="Toutes">Toutes les classes</option>
        <option value="Catégorie">Catégorie</option>
        <option value="Conversation">Conversation</option>
        <option value="Conversation mémorable">
          Conversation mémorable
        </option>
        <option value="Dé">Dé</option>
        <option value="Fiche">Fiche</option>
        <option value="Historique">Historique</option>
        <option value="Parcours">Parcours</option>
      </select>

      <div id="itemList"></div>
    </section>
  </main>

  <script>
    // Données de démonstration
    // URL de l'API Omeka S
const API_URL = "http://localhost/omeka-proxy.php";
    // Les ressources seront chargées depuis Omeka
    let items = [];
    let editingId = null;
const resourceConfig = {
  "Catégorie": { classId: 111, templateId: 5 },
  "Conversation": { classId: 107, templateId: 2 },
  "Conversation mémorable": { classId: 108, templateId: 3 },
  "Dé": { classId: 109, templateId: 7 },
  "Fiche": { classId: 112, templateId: 6 },
  "Historique": { classId: 106, templateId: 4 },
  "Parcours": { classId: 110, templateId: 8 }
};
    const form = document.getElementById("itemForm");
    const resourceClass = document.getElementById("resourceClass");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const itemList = document.getElementById("itemList");
    const filterClass = document.getElementById("filterClass");
    const formTitle = document.getElementById("formTitle");
    const submitButton = document.getElementById("submitButton");
    const cancelButton = document.getElementById("cancelButton");

    // READ : afficher les éléments
    function displayItems() {
      itemList.replaceChildren();

      const selectedClass = filterClass.value;

      const filteredItems = items.filter(item =>
        selectedClass === "Toutes" ||
        item.resourceClass === selectedClass
      );

      if (filteredItems.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "Aucun élément à afficher.";
        itemList.appendChild(message);
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement("article");
        card.className = "item";

        const heading = document.createElement("h3");
        heading.textContent = item.title;

        const classText = document.createElement("p");
        classText.textContent = "Classe : " + item.resourceClass;

        const descriptionText = document.createElement("p");
        descriptionText.textContent =
          item.description || "Aucune description.";

        const editButton = document.createElement("button");
        editButton.className = "edit";
        editButton.textContent = "Modifier";
        editButton.addEventListener("click", () => editItem(item.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Supprimer";
        deleteButton.addEventListener("click", () => deleteItem(item.id));

        card.append(
          heading,
          classText,
          descriptionText,
          editButton,
          deleteButton
        );

        itemList.appendChild(card);
      });
    }

function getResourceDetails(item) {
  const ignoredProperties = [
    "@context",
    "@id",
    "@type",
    "o:id",
    "o:is_public",
    "o:owner",
    "o:resource_class",
    "o:resource_template",
    "o:created",
    "o:modified",
    "o:item_set",
    "o:media",
    "o:primary_media",
    "o:site",
    "o:thumbnail",
    "o:title",
    "thumbnail_display_urls",
    "dcterms:title",
    "dcterms:description"
  ];

  return Object.entries(item)
    .filter(([key]) => !ignoredProperties.includes(key))
    .map(([key, values]) => {
      if (!Array.isArray(values)) return null;

      const text = values
        .map(value => value["@value"] ?? value["o:label"] ?? "")
        .filter(Boolean)
        .join(", ");

      if (!text) return null;

      const propertyName = key.replace("artinq:", "");

      return `${propertyName} : ${text}`;
    })
    .filter(Boolean)
    .join(" | ");
}

    // READ : récupérer les ressources depuis Omeka S
    async function loadItems() {
      try {
        const response = await fetch(
          `${API_URL}?pretty_print=1`
        );

        if (!response.ok) {
          throw new Error("Erreur HTTP : " + response.status);
        }

        const data = await response.json();

      items = data.map(item => {
      const type = item["@type"] || [];

      const classMapping = {
        "artinq:Categorie": "Catégorie",
        "artinq:Conversation": "Conversation",
        "artinq:ConversationMemorable": "Conversation mémorable",
        "artinq:De": "Dé",
        "artinq:Fiche": "Fiche",
        "artinq:Historique": "Historique",
        "artinq:Parcours": "Parcours"
      };

      const typeName = type.find(t => t.startsWith("artinq:"));

      return {
        id: item["o:id"],
        resourceClass: classMapping[typeName] || "Non classé",
        title:
          item["dcterms:title"]?.[0]?.["@value"] ||
          item["o:title"] ||
          "Sans titre",
        description:
          item["dcterms:description"]?.[0]?.["@value"] ||
          getResourceDetails(item) ||
          "Aucune description."
      };
});

        displayItems();

        console.log("Ressources chargées depuis Omeka :", items.length);
      } catch (error) {
        console.error("Erreur de connexion à Omeka :", error);

        itemList.textContent =
          "Impossible de charger les ressources depuis Omeka S.";
      }
    }


    
    // CREATE et UPDATE : ajouter ou modifier un élément
   
form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const selectedClass = resourceClass.value;
  const itemTitle = title.value.trim();
  const itemDescription = description.value.trim();
  const config = resourceConfig[selectedClass];

  if (!itemTitle) {
    alert("Veuillez saisir un titre.");
    return;
  }

  if (!config) {
    alert("Classe de ressource inconnue.");
    return;
  }

  const itemData = {
    "o:resource_class": { "o:id": config.classId },
    "o:resource_template": { "o:id": config.templateId },
    "dcterms:title": [
      {
        type: "literal",
        property_id: 1,
        "@value": itemTitle
      }
    ],
    "dcterms:description": itemDescription
      ? [{
          type: "literal",
          property_id: 4,
          "@value": itemDescription
        }]
      : []
  };

  try {
    const isEditing = editingId !== null;

    const response = await fetch(
      isEditing ? `${API_URL}?id=${editingId}` : API_URL,
      {
        method: isEditing ? "PATCH" : "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(itemData)
      }
    );

    const result = await response.json();

    if (!response.ok) {
      console.error("Erreur Omeka :", result);
      throw new Error(
        result["o:message"] || JSON.stringify(result)
      );
    }

    alert(isEditing
      ? "Ressource modifiée avec succès !"
      : "Ressource ajoutée avec succès !"
    );

    resetForm();
    await loadItems();

  } catch (error) {
    console.error("Erreur CRUD :", error);
    alert("Erreur : " + error.message);
  }
});

    // Préparer la modification
    function editItem(id) {
      const item = items.find(item => item.id === id);

      if (!item) return;

      editingId = id;
      resourceClass.value = item.resourceClass;
      title.value = item.title;
      description.value = item.description;

      formTitle.textContent = "Modifier un élément";
      submitButton.textContent = "Enregistrer";
      cancelButton.hidden = false;

      form.scrollIntoView({ behavior: "smooth" });
    }

    // DELETE : supprimer un élément
    
async function deleteItem(id) {
  const confirmed = confirm(
    "Voulez-vous vraiment supprimer cet élément ?"
  );

  if (!confirmed) return;

  try {
    const response = await fetch(`${API_URL}?id=${id}`, {
      method: "DELETE"
    });

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error || "Suppression impossible.");
    }

    if (editingId === id) {
      resetForm();
    }

    alert("Ressource supprimée avec succès !");
    await loadItems();

  } catch (error) {
    console.error("Erreur de suppression :", error);
    alert("Erreur : " + error.message);
  }
}

    // Annuler une modification
    function resetForm() {
      form.reset();
      editingId = null;
      formTitle.textContent = "Ajouter un élément";
      submitButton.textContent = "Ajouter";
      cancelButton.hidden = true;
    }

    cancelButton.addEventListener("click", resetForm);
    filterClass.addEventListener("change", displayItems);

    // Authentification locale : le serveur vérifie aussi la session
    const authStatus = document.getElementById("authStatus");
    const loginLink = document.getElementById("loginLink");
    const logoutButton = document.getElementById("logoutButton");

    function setCrudEnabled(enabled) {
      form.querySelectorAll("input, select, textarea, button")
        .forEach(element => { element.disabled = !enabled; });
      filterClass.disabled = !enabled;
      itemList.querySelectorAll("button").forEach(button => {
        button.disabled = !enabled;
      });
    }

    async function checkAuthentication() {
      try {
        const response = await fetch("/auth/check.php", {
          method: "GET",
          credentials: "same-origin"
        });
        const result = await response.json();

        if (!response.ok || !result.authenticated) {
          throw new Error("Connexion requise.");
        }

        authStatus.textContent = "Connecté : " + result.user.name;
        loginLink.hidden = true;
        logoutButton.hidden = false;
        setCrudEnabled(true);
        await loadItems();
      } catch (error) {
        authStatus.textContent = "Veuillez vous connecter pour gérer les ressources.";
        loginLink.hidden = false;
        logoutButton.hidden = true;
        setCrudEnabled(false);
        itemList.textContent = "Connectez-vous pour afficher les ressources.";
      }
    }

    loginLink.addEventListener("click", () => {
      window.location.href = "/auth.html";
    });

    logoutButton.addEventListener("click", async () => {
      try {
        const response = await fetch("/auth/logout.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({})
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || "Déconnexion impossible.");
        }
        window.location.href = "/auth.html";
      } catch (error) {
        alert(error.message);
      }
    });

    setCrudEnabled(false);
    checkAuthentication();
  </script>
</body>
</html>
